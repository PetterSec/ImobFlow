version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: imobflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-imobflow}
      POSTGRES_USER: ${POSTGRES_USER:-imobflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-imobflow_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: imobflow_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-imobflow_user}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-imobflow}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # hot-reload em dev — remover em produção
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
