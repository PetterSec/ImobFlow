{% extends "base.html" %}
{% block title %}Novo Lançamento{% endblock %}
{% block page_title %}Novo Lançamento{% endblock %}
{% block breadcrumb %}<a href="{{ url_for('financeiro.listar') }}">Lançamentos</a> / Novo{% endblock %}
{% block content %}
<div style="max-width:640px;">
  <div class="card">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Descrição *</label>
        <input type="text" name="descricao" class="form-control" required autofocus
               placeholder="Ex: Conta de água — Março">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Tipo *</label>
          <select name="tipo" class="form-control" id="tipoSelect" onchange="atualizarCats()">
            <option value="despesa">💸 Despesa</option>
            <option value="receita">💰 Receita</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Valor (R$) *</label>
          <input type="number" name="valor" class="form-control" step="0.01" min="0.01"
                 required placeholder="0,00">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Categoria</label>
          <select name="categoria" class="form-control" id="catSelect">
            {% for c in cats_despesa %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Data</label>
          <input type="date" name="data" class="form-control"
                 value="{{ today }}">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Condomínio *</label>
        <select name="condominio_id" class="form-control" required>
          <option value="">— Selecione —</option>
          {% for c in condominios %}
          <option value="{{ c.id }}">{{ c.nome }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Observação</label>
        <textarea name="observacao" class="form-control" rows="2" placeholder="Opcional..."></textarea>
      </div>

      <div class="form-check form-group">
        <input type="checkbox" name="pago" id="pago">
        <label for="pago" class="form-label" style="margin:0;cursor:pointer;">Marcar como pago/recebido</label>
      </div>

      <div style="display:flex;gap:12px;margin-top:8px;">
        <button type="submit" class="btn btn-primary">💾 Registrar</button>
        <a href="{{ url_for('financeiro.listar') }}" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const catsDespesa = {{ cats_despesa | tojson }};
const catsReceita = {{ cats_receita | tojson }};
const sel = document.getElementById('catSelect');

function atualizarCats() {
  const tipo = document.getElementById('tipoSelect').value;
  const lista = tipo === 'receita' ? catsReceita : catsDespesa;
  sel.innerHTML = lista.map(c => `<option value="${c}">${c}</option>`).join('');
}
</script>
{% endblock %}
