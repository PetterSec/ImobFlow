<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — ImobFlow</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card" style="max-width:480px;">
    <div class="auth-logo">
      <span class="logo-icon">🏢</span>
      <div class="logo-big">ImobFlow</div>
      <p>Crie sua conta gratuitamente</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}" style="margin-bottom:16px;">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Nome completo</label>
        <input type="text" name="nome" class="form-control" placeholder="Seu nome" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Senha (mínimo 6 caracteres)</label>
        <input type="password" name="senha" class="form-control" placeholder="••••••••" required>
      </div>
      <div class="form-group">
        <label class="form-label">Perfil</label>
        <select name="perfil" class="form-control">
          <option value="sindico">Síndico / Administrador</option>
          <option value="imobiliaria">Imobiliária / Corretor</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:1rem;margin-top:8px;">
        ＋ Criar Conta
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:0.85rem;color:var(--subtext);">
      Já tem conta? <a href="{{ url_for('auth.login') }}">Fazer login</a>
    </p>
  </div>
</div>
</body>
</html>
