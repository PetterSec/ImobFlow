<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — ImobFlow</title>
  <link rel="icon" href="/static/logo-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card" style="max-width:460px;">
    <div class="auth-logo">
      <div class="auth-logo-mark">
        <svg width="44" height="44" viewBox="0 0 48 48" fill="none">
          <path d="M24 5L41 14.8V33.2L24 43L7 33.2V14.8L24 5Z" stroke="#C9963A" stroke-width="1.2" fill="none"/>
          <path d="M24 11L34 16.8V27.2L24 33L14 27.2V16.8L24 11Z" fill="#6B1E3C" stroke="#C9963A" stroke-width="1"/>
          <path d="M24 17L29 19.9V25.1L24 28L19 25.1V19.9L24 17Z" fill="#C9963A"/>
        </svg>
      </div>
      <div class="auth-logo-name">ImobFlow</div>
      <p>Crie sua conta gratuitamente</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}" style="margin-bottom:16px;">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">Nome completo</label>
        <input type="text" name="nome" class="form-control" placeholder="Seu nome completo" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <input type="password" name="senha" class="form-control" placeholder="Mínimo 6 caracteres" required>
        <div class="form-hint">Use uma senha forte com letras, números e símbolos.</div>
      </div>
      <div class="form-group" style="margin-bottom:24px;">
        <label class="form-label">Perfil</label>
        <select name="perfil" class="form-control">
          <option value="sindico">Síndico / Administrador</option>
          <option value="imobiliaria">Imobiliária / Corretor</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:13px;font-size:.95rem;">
        Criar conta gratuita
      </button>
    </form>

    <div class="auth-divider">ou</div>

    <p style="text-align:center;font-size:.82rem;color:var(--muted);">
      Já tem conta?
      <a href="{{ url_for('auth.login') }}" style="color:var(--gold);font-weight:500;">Fazer login</a>
    </p>
  </div>
</div>
</body>
</html>
