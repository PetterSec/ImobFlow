<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Morador — ImobFlow</title>
  <link rel="icon" href="/static/logo-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="auth-logo-mark">
        <svg width="52" height="52" viewBox="0 0 48 48" fill="none">
          <path d="M24 5L41 14.8V33.2L24 43L7 33.2V14.8L24 5Z" stroke="#D4A843" stroke-width="1.2" fill="none"/>
          <path d="M24 11L34 16.8V27.2L24 33L14 27.2V16.8L24 11Z" fill="#8C2B47" stroke="#D4A843" stroke-width="1"/>
          <path d="M24 17L29 19.9V25.1L24 28L19 25.1V19.9L24 17Z" fill="#D4A843"/>
        </svg>
      </div>
      <div class="auth-logo-name">ImobFlow</div>
      <p>Portal do Morador</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control"
               placeholder="seu@email.com" required autofocus
               autocomplete="email">
      </div>
      <div class="form-group" style="margin-bottom:24px;">
        <label class="form-label">Senha</label>
        <input type="password" name="senha" class="form-control"
               placeholder="••••••••" required autocomplete="current-password">
        <div class="form-hint">
          Sua senha foi definida pelo síndico. Em caso de dúvida, entre em contato.
        </div>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">
        Acessar meu portal
      </button>
    </form>

    <div class="auth-footer" style="margin-top:20px;">
      <a href="{{ url_for('auth.login') }}"
         style="color:var(--muted);font-size:13px;">
        ← Acesso administrativo
      </a>
    </div>

  </div>
</div>
</body>
</html>
